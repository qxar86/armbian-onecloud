name: CI

on:
  workflow_dispatch:
  push:
    branches:
      - readme
    paths:
      - .github/workflows/ci.yml

env:
  SCRIPT_REPO: ${{ github.repository }}
  SCRIPT_REF: ${{ github.ref_name }}
  UBOOT_REPO: hzyitc/u-boot
  UBOOT_RELEASE: latest
  UBOOT_BURNIMG: eMMC.burn.img
  ARMBIAN_REPO: armbian/build
  ARMBIAN_REF: main
  PATCHES: 4077,5076

permissions:
  contents: write

jobs:
  prepare:
    name: Prepare
    runs-on: ubuntu-22.04
    outputs:
      env: ${{ steps.get.outputs.env }}
      tag: ${{ steps.get.outputs.tag }}
    steps:
      - id: get
        name: Get repositories information
        run: |
          TIME="$(curl -s https://api.github.com/repos/${SCRIPT_REPO}/actions/runs/${GITHUB_RUN_ID} | jq -r .created_at)"
          TAG="ci-$(date -d "${TIME}" -u +'%Y%m%d-%H%M%S')"
          SCRIPT_SHA=$(curl -s https://api.github.com/repos/${SCRIPT_REPO}/commits/${SCRIPT_REF} | jq -r .sha)
          UBOOT_TAG=$(curl -s https://api.github.com/repos/${UBOOT_REPO}/releases/${UBOOT_RELEASE} | jq -r .tag_name)
          ARMBIAN_SHA=$(curl -s https://api.github.com/repos/${ARMBIAN_REPO}/commits/${ARMBIAN_REF} | jq -r .sha)

          {
            echo "TIME=$TIME"
            echo "TAG=$TAG"
            echo "SCRIPT_SHA=$SCRIPT_SHA"
            echo "UBOOT_TAG=$UBOOT_TAG"
            echo "ARMBIAN_SHA=$ARMBIAN_SHA"
          } >> "$GITHUB_ENV"
          
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "env=$(cat $GITHUB_ENV | base64 -w 0)" >> $GITHUB_OUTPUT

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.get.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: ${{ steps.get.outputs.tag }}
          body: |
            ## 构建说明
            - 包含线刷包 (Burn Package) 和普通镜像 (Standard Image)
            - 线刷包适用于 Amlogic 刷机工具
            
            ## 源码信息
            - Armbian: [${{ env.ARMBIAN_REPO }}](${{ github.server_url }}/${{ env.ARMBIAN_REPO }}/tree/${{ env.ARMBIAN_SHA }})

  build-debs:
    name: Build Kernel
    needs: prepare
    runs-on: ubuntu-22.04
    strategy:
      matrix:
        BRANCH: [current]
    steps:
      - name: Import env
        run: echo "$(echo "${{ needs.prepare.outputs.env }}" | base64 -d)" >> $GITHUB_ENV

      - name: Checkout Armbian
        uses: actions/checkout@v4
        with:
          repository: ${{ env.ARMBIAN_REPO }}
          ref: ${{ env.ARMBIAN_SHA }}

      - name: Cache ccache
        uses: actions/cache@v4
        with:
          path: .ccache
          key: ${{ runner.os }}-ccache-${{ matrix.BRANCH }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-ccache-${{ matrix.BRANCH }}-

      - name: Build Kernel
        run: |
          export GITHUB_ACTIONS=false
          mkdir -p .ccache
          sudo --preserve-env ./compile.sh kernel \
            ALLOW_ROOT=yes BOARD=onecloud BRANCH=${{ matrix.BRANCH }} \
            EXPERT=yes USE_CCACHE=yes CCACHE_DIR=$(pwd)/.ccache SKIP_INIT_BINFMTS=yes
          sudo chown $(id -u):$(id -g) -R output/
          sudo chown $(id -u):$(id -g) -R .ccache

      - name: Upload Kernel Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: debs-${{ matrix.BRANCH }}
          path: output/debs/
          retention-days: 1

  build:
    name: Build ${{ matrix.RELEASE }}-${{ matrix.TYPE }}
    needs: [ prepare, build-debs ]
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        BRANCH: [current]
        RELEASE: [jammy, noble, bookworm]
        TYPE: [minimal, cli]
    steps:
      - name: Import env
        run: echo "$(echo "${{ needs.prepare.outputs.env }}" | base64 -d)" >> $GITHUB_ENV

      - name: Checkout Armbian
        uses: actions/checkout@v4
        with:
          repository: ${{ env.ARMBIAN_REPO }}
          ref: ${{ env.ARMBIAN_SHA }}

      - name: Download Kernel Debs
        uses: actions/download-artifact@v4
        with:
          name: debs-${{ matrix.BRANCH }}
          path: output/debs/

      - name: Build OS Image
        run: |
          export GITHUB_ACTIONS=false
          sudo --preserve-env ./compile.sh build \
              ALLOW_ROOT=yes BOARD=onecloud BRANCH=${{ matrix.BRANCH }} RELEASE=${{ matrix.RELEASE }} \
              KERNEL_CONFIGURE=no EXPERT=yes SKIP_EXTERNAL_TOOLCHAINS=yes USE_CCACHE=no \
              SKIP_INIT_BINFMTS=yes \
              BUILD_MINIMAL=${{ matrix.TYPE == 'minimal' && 'yes' || 'no' }} \
              BUILD_DESKTOP=no COMPRESS_OUTPUTIMAGE=img
          sudo chown $(id -u):$(id -g) -R output/

      - name: Post Process & Rename
        id: postprocess
        run: |
          sudo apt update && sudo apt install -y img2simg
          curl -L -o ./AmlImg https://github.com/hzyitc/AmlImg/releases/download/v0.3.1/AmlImg_v0.3.1_linux_amd64 && chmod +x ./AmlImg
          
          # 找到内核 deb 包（优先找 arm64 架构的）
          DEB_FILE=$(ls output/debs/linux-image-*_arm64.deb 2>/dev/null | head -n 1)
          [ -z "$DEB_FILE" ] && DEB_FILE=$(ls output/debs/linux-image-*.deb | head -n 1)
          
          if [ -z "$DEB_FILE" ]; then
            echo "错误：没有找到 linux-image 相关的 deb 包" >&2
            exit 1
          fi
          
          echo "使用的 deb 包: $DEB_FILE"
          
          # 尝试从 Version 字段提取内核版本（最可靠的方式）
          REAL_KERNEL=$(dpkg-deb -f "$DEB_FILE" Version | grep -oE '^[0-9]+\.[0-9]+\.[0-9]+(-rc[0-9]+)?' | head -n 1)
          
          # 如果 Version 里没有纯数字版本，fallback 到清理 Package 字段
          if [ -z "$REAL_KERNEL" ]; then
            PKG_NAME=$(dpkg-deb -f "$DEB_FILE" Package)
            REAL_KERNEL=$(echo "$PKG_NAME" | sed -E '
              s/^linux-image-//;
              s/-onecloud$//;
              s/-(current|edge|legacy|meson|amlogic|meson8b|mesongxl|mesongxbb).*//;
              s/-[a-z]+-[0-9]+$//;
              s/^[a-z]+-//;
              ' | grep -E '^[0-9]+\.[0-9]+' || echo "unknown")
          fi
          
          # Armbian 版本号（保留 -trunk，如果有的话）
          ARMBIAN_FULL_VER=$(dpkg-deb -f "$DEB_FILE" Version)
          ARMBIAN_VER=$(echo "$ARMBIAN_FULL_VER" | cut -d'~' -f1 | sed 's/-[a-z0-9]\+$//')
          
          echo "提取到的内核版本: $REAL_KERNEL"
          echo "提取到的 Armbian 版本: $ARMBIAN_VER"
          
          echo "kernel_ver=$REAL_KERNEL" >> $GITHUB_OUTPUT
          echo "armbian_ver=$ARMBIAN_VER" >> $GITHUB_OUTPUT
          
          # 最终文件名（你想要的格式）
          BASE_NAME="Armbian_Onecloud_${ARMBIAN_VER}_${{ matrix.RELEASE }}_${{ matrix.BRANCH }}_${REAL_KERNEL}_${{ matrix.TYPE }}"
          BURN_NAME="${BASE_NAME}.burn"
          
          echo "生成的普通镜像名: ${BASE_NAME}.img"
          echo "生成的烧录包名: ${BURN_NAME}.img"
          
          # 生成烧录包
          curl -L -o ./uboot.img https://github.com/${UBOOT_REPO}/releases/download/${UBOOT_TAG}/${UBOOT_BURNIMG}
          ./AmlImg unpack ./uboot.img burn/
          
          diskimg=$(ls output/images/*.img | head -n 1)
          if [ -z "$diskimg" ]; then
            echo "错误：output/images/ 里没有找到 .img 文件" >&2
            exit 1
          fi
          
          loop=$(sudo losetup --find --show --partscan "$diskimg")
          sudo img2simg "${loop}p1" burn/boot.simg
          sudo img2simg "${loop}p2" burn/rootfs.simg
          sudo losetup -d "$loop"
          
          echo -n "sha1sum $(sha1sum burn/boot.simg | awk '{print $1}')" > burn/boot.VERIFY
          echo -n "sha1sum $(sha1sum burn/rootfs.simg | awk '{print $1}')" > burn/rootfs.VERIFY
          
          cat <<EOF >>burn/commands.txt
          PARTITION:boot:sparse:boot.simg
          VERIFY:boot:normal:boot.VERIFY
          PARTITION:rootfs:sparse:rootfs.simg
          VERIFY:rootfs:normal:rootfs.VERIFY
          EOF
          
          ./AmlImg pack output/images/${BURN_NAME}.img burn/
          
          # 重命名普通镜像
          mv "$diskimg" "output/images/${BASE_NAME}.img"

      - name: Compress & Hash
        run: |
          cd output/images/
          for f in *.img; do
            if [ -f "$f" ]; then
              sha256sum "$f" >> ../../sha256sum_list.txt
              xz -9 --threads=0 "$f"
            fi
          done

      - name: Upload to Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.prepare.outputs.tag }}
          append_body: true
          body: |
            ---
            ### 镜像规格: ${{ matrix.RELEASE }} - ${{ matrix.TYPE }}
            - **Armbian 版本**: `${{ steps.postprocess.outputs.armbian_ver }}`
            - **内核版本**: `${{ steps.postprocess.outputs.kernel_ver }}`
          files: |
            output/images/*.xz
            output/images/*.burn.img
