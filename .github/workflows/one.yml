name: one

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - .github/workflows/one.yml

env:
  SCRIPT_REPO: ${{ github.repository }}
  SCRIPT_REF: ${{ github.ref_name }}
  UBOOT_REPO: qxar86/onecloud-u-boot
  UBOOT_RELEASE: latest
  UBOOT_BURNIMG: eMMC.burn.img
  ARMBIAN_REPO: hzyitc/u-boot-onecloud
  ARMBIAN_REF: main

permissions:
  contents: write

jobs:
  prepare:
    name: Prepare Release
    runs-on: ubuntu-22.04
    outputs:
      env: ${{ steps.get.outputs.env }}
      tag: ${{ steps.get.outputs.tag }}

    steps:
      - id: get
        name: Get repositories information
        run: |
          TIME="$(curl -s https://api.github.com/repos/${SCRIPT_REPO}/actions/runs/${GITHUB_RUN_ID} | jq -r .created_at)"
          TAG="ci-$(date -d "${TIME}" -u +'%Y%m%d-%H%M%S')"
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          
          # 构建环境参数并导出
          UBOOT_TAG=$(curl -s https://api.github.com/repos/${UBOOT_REPO}/releases/${UBOOT_RELEASE} | jq -r .tag_name)
          cat <<EOF | sed -E 's/^ //' >> $GITHUB_ENV
            TIME=$TIME
            TAG=$TAG
            UBOOT_TAG=$UBOOT_TAG
          EOF
          echo "env=$(cat $GITHUB_ENV | base64 -w 0)" >> $GITHUB_OUTPUT

      - name: Create Release with Instructions
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          name: 玩客云 Armbian 自动构建 - $(date -d "${{ env.TIME }}" +'%Y%m%d')
          body: |
            ## 📝 刷机说明 (Flashing Guide)
            
            ### 1. 线刷固件 (`.burn.img.xz`)
            - **适用场景**：直接刷入 eMMC，替换原系统。
            - **工具**：使用 Windows 平台的 `Amlogic USB Burning Tool`。
            - **步骤**：
              1. 解压 `.burn.img.xz` 得到 `.burn.img`。
              2. 打开烧录工具，导入镜像，点击“开始”。
              3. 按住玩客云 **Reset 键**（或短接），接入双公头 USB 线至靠近网口的 USB 口，通电。
            
            ### 2. 卡刷镜像 (`.img.xz`)
            - **工具**：`Rufus` 或 `BalenaEtcher`。
            - **步骤**：将镜像写入 SD 卡或 U 盘，插入设备后通过 U-Boot 引导。
            
            ### 🔑 默认账户
            - **用户**: `root`
            - **密码**: `1234`
            
            ---
            *构建时间: ${{ env.TIME }}*
          draft: false
          prerelease: false
          token: ${{ secrets.GITHUB_TOKEN }}

  build-debs:
    name: Build ${{ matrix.BRANCH }} Kernel
    needs: prepare
    runs-on: ubuntu-22.04
    strategy:
      matrix:
        BRANCH: [current, legacy]
    steps:
      - name: Cleanup Disk Space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
          sudo apt-get clean

      - name: Import env
        run: echo "${{ needs.prepare.outputs.env }}" | base64 -d >> $GITHUB_ENV

      - name: Checkout Armbian
        uses: actions/checkout@v4
        with:
          repository: ${{ env.ARMBIAN_REPO }}
          ref: main

      - name: Build Kernel
        run: |
          export GITHUB_ACTIONS=false
          sudo --preserve-env ./compile.sh kernel ALLOW_ROOT=yes BOARD=onecloud BRANCH=${{ matrix.BRANCH }} EXPERT=yes USE_CCACHE=no
          sudo chown -R $(id -u):$(id -g) output/

      - name: Upload Kernel Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: debs-${{ matrix.BRANCH }}
          path: output/debs/*

  build:
    name: Build ${{ matrix.RELEASE }}-${{ matrix.BRANCH }}
    needs: [prepare, build-debs]
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        BRANCH: [current, legacy]
        RELEASE: [jammy, bookworm, noble]
        TYPE: [minimal]
    steps:
      - name: Cleanup Disk Space
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc

      - name: Import env
        run: echo "${{ needs.prepare.outputs.env }}" | base64 -d >> $GITHUB_ENV

      - name: Checkout Armbian
        uses: actions/checkout@v4
        with:
          repository: ${{ env.ARMBIAN_REPO }}
          ref: main

      - name: Download Kernel Debs
        uses: actions/download-artifact@v4
        with:
          name: debs-${{ matrix.BRANCH }}
          path: output/debs/

      - name: Build Image
        run: |
          export GITHUB_ACTIONS=false
          sudo --preserve-env ./compile.sh build ALLOW_ROOT=yes BOARD=onecloud BRANCH=${{ matrix.BRANCH }} RELEASE=${{ matrix.RELEASE }} \
            KERNEL_CONFIGURE=no BUILD_MINIMAL=yes BUILD_DESKTOP=no EXPERT=yes SKIP_EXTERNAL_TOOLCHAINS=yes CLEAN_LEVEL= USE_CCACHE=no COMPRESS_OUTPUTIMAGE=sha,xz
          sudo chown -R $(id -u):$(id -g) output/

      - name: Process Amlogic Burn Image
        run: |
          sudo apt update && sudo apt install -y img2simg
          curl -L -o AmlImg "https://github.com/hzyitc/AmlImg/releases/download/v0.3.1/AmlImg_v0.3.1_linux_amd64"
          chmod +x AmlImg
          
          # 下载 U-Boot 线刷底包
          curl -L -o uboot.img "https://github.com/${UBOOT_REPO}/releases/download/${UBOOT_TAG}/${UBOOT_BURNIMG}"
          ./AmlImg unpack ./uboot.img burn/
          
          # 提取 Armbian 分区并转换
          diskimg=$(ls -1 output/images/*.img | head -n1)
          loop=$(sudo losetup --find --show --partscan "$diskimg")
          sleep 2
          sudo img2simg "${loop}p1" burn/boot.simg
          sudo img2simg "${loop}p2" burn/rootfs.simg
          sudo losetup -d "$loop"
          
          # 生成校验并打包
          echo -n "sha1sum $(sha1sum burn/boot.simg | awk '{print $1}')" > burn/boot.VERIFY
          echo -n "sha1sum $(sha1sum burn/rootfs.simg | awk '{print $1}')" > burn/rootfs.VERIFY
          cat <<EOF >> burn/commands.txt
          PARTITION:boot:sparse:boot.simg
          VERIFY:boot:normal:boot.VERIFY
          PARTITION:rootfs:sparse:rootfs.simg
          VERIFY:rootfs:normal:rootfs.VERIFY
          EOF
          
          burn_name="$(basename "$diskimg" .img).burn.img"
          ./AmlImg pack "$burn_name" burn/
          xz -9 -T0 "$burn_name"

      - name: Upload to Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          files: |
            output/images/*.xz
            *.burn.img.xz
