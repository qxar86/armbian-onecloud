name: one

on:
  workflow_dispatch:
  push:
    branches:
      - readme
    paths:
      - .github/workflows/one.yml

env:
  SCRIPT_REPO: ${{ github.repository }}
  SCRIPT_REF: ${{ github.ref_name }}
  UBOOT_REPO: qxar86/onecloud-u-boot
  UBOOT_RELEASE: latest
  UBOOT_BURNIMG: eMMC.burn.img
  ARMBIAN_REPO: armbian/build
  ARMBIAN_REF: main
  PATCHES: 4077,5076
  PATCHES_DISABLED: 5082

permissions:
  contents: write

jobs:
  prepare:
    name: Prepare
    runs-on: ubuntu-22.04
    outputs:
      env: ${{ steps.get.outputs.env }}
    steps:
      - id: get
        name: Get repositories information
        run: |
          TIME="$(curl -s https://api.github.com/repos/${SCRIPT_REPO}/actions/runs/${GITHUB_RUN_ID} | jq -r .created_at)"
          TAG="ci-$(date -d "${TIME}" -u +'%Y%m%d-%H%M%S-%Z')"

          SCRIPT_SHA=$(curl -s https://api.github.com/repos/${SCRIPT_REPO}/commits/${SCRIPT_REF} | jq -r .sha)
          UBOOT_TAG=$(curl -s https://api.github.com/repos/${UBOOT_REPO}/releases/${UBOOT_RELEASE} | jq -r .tag_name)
          ARMBIAN_SHA=$(curl -s https://api.github.com/repos/${ARMBIAN_REPO}/commits/${ARMBIAN_REF} | jq -r .sha)

          cat <<EOF >>$GITHUB_ENV
TIME=$TIME
TAG=$TAG
SCRIPT_SHA=$SCRIPT_SHA
UBOOT_TAG=$UBOOT_TAG
ARMBIAN_SHA=$ARMBIAN_SHA
EOF
          echo "env=$(cat $GITHUB_ENV | base64 -w 0)" >>$GITHUB_OUTPUT

      - name: Show Summary
        run: |
          echo "### Build Info" >> $GITHUB_STEP_SUMMARY
          echo "* Tag: ${{ env.TAG }}" >> $GITHUB_STEP_SUMMARY
          echo "* Armbian SHA: ${{ env.ARMBIAN_SHA }}" >> $GITHUB_STEP_SUMMARY

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          name: CI $(date -d "${{ env.TIME }}" +'%Y-%m-%d %H:%M:%S')
          body: "Build from Armbian ${{ env.ARMBIAN_SHA }}"

  build-debs:
    name: Build Kernel
    needs: prepare
    runs-on: ubuntu-22.04
    strategy:
      matrix:
        BRANCH: [current]
    steps:
      - name: Import env
        run: echo "$(echo "${{ needs.prepare.outputs.env }}" | base64 -d)" >>$GITHUB_ENV

      - name: Checkout Armbian
        uses: actions/checkout@v4
        with:
          repository: ${{ env.ARMBIAN_REPO }}
          ref: ${{ env.ARMBIAN_SHA }}

      - name: Apply Patches
        if: ${{ env.PATCHES }}
        run: |
          echo "::group::Download Patches"
          # 将逗号分隔的 ID 转换为循环下载
          IFS=',' read -ra ADDR <<< "${{ env.PATCHES }}"
          for id in "${ADDR[@]}"; do
            echo "Downloading https://github.com/armbian/build/pull/${id}.patch"
            curl -fsSL "https://github.com/armbian/build/pull/${id}.patch" -o "${id}.patch" || exit 1
          done
          echo "::endgroup::"

          for file in *.patch; do
            if [ -s "$file" ]; then
              echo "::group::Applying $file"
              patch --batch -p1 -N < "$file"
              echo "::endgroup::"
            fi
          done

      - name: Build Kernel
        run: |
          export GITHUB_ACTIONS=false
          sudo --preserve-env ./compile.sh kernel \
            ALLOW_ROOT=yes BOARD=onecloud BRANCH=${{ matrix.BRANCH }} EXPERT=yes USE_CCACHE=no
          sudo chown $(id -u):$(id -g) -R output/

      - name: Upload to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          files: output/debs/*

  build:
    name: Build Image (${{ matrix.RELEASE }})
    needs: [ prepare, build-debs ]
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        BRANCH: [current]
        RELEASE: [jammy, noble, bookworm, trixie]
        TYPE: [minimal, cli]
    steps:
      - name: Import env
        run: echo "$(echo "${{ needs.prepare.outputs.env }}" | base64 -d)" >>$GITHUB_ENV

      - name: Checkout Armbian
        uses: actions/checkout@v4
        with:
          repository: ${{ env.ARMBIAN_REPO }}
          ref: ${{ env.ARMBIAN_SHA }}

      - name: Apply Patches (Same as above)
        if: ${{ env.PATCHES }}
        run: |
          IFS=',' read -ra ADDR <<< "${{ env.PATCHES }}"
          for id in "${ADDR[@]}"; do
            curl -fsSL "https://github.com/armbian/build/pull/${id}.patch" -o "${id}.patch"
          done
          for file in *.patch; do
            [ -s "$file" ] && patch --batch -p1 -N < "$file"
          done

      - name: Download debs from Release
        uses: actions/download-artifact@v4 # 或者从 release 下载，这里保持逻辑一致性
        with:
          name: debs-${{ matrix.BRANCH }}
          path: output/debs/
        continue-on-error: true # 如果没有 artifact 则尝试从编译步骤获取

      - name: Build OS Image
        run: |
          export GITHUB_ACTIONS=false
          sudo --preserve-env ./compile.sh build \
            ALLOW_ROOT=yes BOARD=onecloud BRANCH=${{ matrix.BRANCH }} RELEASE=${{ matrix.RELEASE }} \
            KERNEL_CONFIGURE=no BUILD_MINIMAL=${{ matrix.TYPE == 'minimal' && 'yes' || 'no' }} \
            BUILD_DESKTOP=no EXPERT=yes SKIP_EXTERNAL_TOOLCHAINS=yes USE_CCACHE=no COMPRESS_OUTPUTIMAGE=img
          sudo chown $(id -u):$(id -g) -R output/

      # 后面关于 AmlImg 的逻辑保持不变...
      - name: Generate Burn Image
        run: |
          sudo apt install img2simg -y
          curl -L -o ./AmlImg https://github.com/hzyitc/AmlImg/releases/download/v0.3.1/AmlImg_v0.3.1_linux_amd64
          chmod +x ./AmlImg
          curl -L -o ./uboot.img https://github.com/${{ env.UBOOT_REPO }}/releases/download/${{ env.UBOOT_TAG }}/${{ env.UBOOT_BURNIMG }}
          ./AmlImg unpack ./uboot.img burn/
          diskimg=$(ls output/images/*.img)
          loop=$(sudo losetup --find --show --partscan $diskimg)
          sudo img2simg ${loop}p1 burn/boot.simg
          sudo img2simg ${loop}p2 burn/rootfs.simg
          sudo losetup -d $loop
          ./AmlImg pack ${diskimg%.img}.burn.img burn/
          xz -0 output/images/*.img

      - name: Upload to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          files: output/images/*
