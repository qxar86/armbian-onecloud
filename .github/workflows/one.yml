name: OneCloud-Armbian-CI

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths: [ '.github/workflows/one.yml' ]

env:
  UBOOT_REPO: qxar86/onecloud-u-boot
  UBOOT_RELEASE: latest
  UBOOT_BURNIMG: eMMC.burn.img
  ARMBIAN_REPO: hzyitc/u-boot-onecloud
  ARMBIAN_REF: main

permissions:
  contents: write

jobs:
  prepare:
    name: Prepare Release
    runs-on: ubuntu-22.04
    outputs:
      env: ${{ steps.get.outputs.env }}
      tag: ${{ steps.get.outputs.tag }}

    steps:
      - id: get
        name: Get repositories information
        run: |
          TIME=$(date +'%Y-%m-%d %H:%M:%S')
          # 显式生成 Tag 并传递给 outputs 以修复报错
          TAG="ci-$(date +'%Y%m%d-%H%M%S')"
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          
          UBOOT_TAG=$(curl -s https://api.github.com/repos/${UBOOT_REPO}/releases/${UBOOT_RELEASE} | jq -r .tag_name)
          
          echo "TIME=$TIME" >> $GITHUB_ENV
          echo "TAG=$TAG" >> $GITHUB_ENV
          echo "UBOOT_TAG=$UBOOT_TAG" >> $GITHUB_ENV
          
          echo "env=$(cat $GITHUB_ENV | base64 -w 0)" >> $GITHUB_OUTPUT

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.get.outputs.tag }}
          name: 玩客云 Armbian - ${{ steps.get.outputs.tag }}
          body: |
            ## 📝 刷机说明
            - **线刷包 (.burn.img.xz)**：使用 Amlogic USB Burning Tool 直接刷入 eMMC。
            - **卡刷包 (.img.xz)**：使用 Rufus 或 Etcher 写入 SD 卡启动。
            - **系统版本**：Ubuntu 22.04 (Jammy), Debian 12 (Bookworm), **Debian 13 (Trixie)**。
            - **内核说明**：仅编译 Current (主流稳定) 内核，已移除 Legacy 内核。
          draft: false
          prerelease: false
          token: ${{ secrets.GITHUB_TOKEN }}

  build:
    name: Build ${{ matrix.RELEASE }}
    needs: prepare
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        BRANCH: [current] # 仅保留 Current 分支
        RELEASE: [jammy, bookworm, trixie] # 包含 Debian 13 (Trixie)
    steps:
      - name: 🧹 释放磁盘空间
        run: |
          # 删除预装软件以腾出约 20GB+ 空间
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/share/boost
          sudo apt-get clean

      - name: Import env
        run: echo "${{ needs.prepare.outputs.env }}" | base64 -d >> $GITHUB_ENV

      - name: Checkout Armbian
        uses: actions/checkout@v4
        with:
          repository: ${{ env.ARMBIAN_REPO }}
          ref: ${{ env.ARMBIAN_REF }}

      - name: Build Image
        run: |
          export GITHUB_ACTIONS=false
          # 执行 Armbian 编译脚本
          sudo --preserve-env ./compile.sh build ALLOW_ROOT=yes BOARD=onecloud BRANCH=${{ matrix.BRANCH }} RELEASE=${{ matrix.RELEASE }} \
            BUILD_MINIMAL=yes BUILD_DESKTOP=no EXPERT=yes KERNEL_CONFIGURE=no \
            SKIP_EXTERNAL_TOOLCHAINS=yes CLEAN_LEVEL= USE_CCACHE=no COMPRESS_OUTPUTIMAGE=sha,xz
          sudo chown -R $(id -u):$(id -g) output/

      - name: Process Amlogic Burn Image
        run: |
          sudo apt update && sudo apt install -y img2simg
          # 下载线刷转换工具 AmlImg
          curl -L -o AmlImg "https://github.com/hzyitc/AmlImg/releases/download/v0.3.1/AmlImg_v0.3.1_linux_amd64"
          chmod +x AmlImg
          
          # 下载 U-Boot 底包并解包
          curl -L -o uboot.img "https://github.com/${UBOOT_REPO}/releases/download/${UBOOT_TAG}/${UBOOT_BURNIMG}"
          ./AmlImg unpack ./uboot.img burn/
          
          # 将编译好的镜像挂载并提取分区
          diskimg=$(ls -1 output/images/*.img | head -n1)
          loop=$(sudo losetup --find --show --partscan "$diskimg")
          sleep 2
          sudo img2simg "${loop}p1" burn/boot.simg
          sudo img2simg "${loop}p2" burn/rootfs.simg
          sudo losetup -d "$loop"
          
          # 生成线刷包指令
          echo -n "sha1sum $(sha1sum burn/boot.simg | awk '{print $1}')" > burn/boot.VERIFY
          echo -n "sha1sum $(sha1sum burn/rootfs.simg | awk '{print $1}')" > burn/rootfs.VERIFY
          cat <<EOF >> burn/commands.txt
          PARTITION:boot:sparse:boot.simg
          VERIFY:boot:normal:boot.VERIFY
          PARTITION:rootfs:sparse:rootfs.simg
          VERIFY:rootfs:normal:rootfs.VERIFY
          EOF
          
          # 重新打包为线刷镜像并压缩
          burn_name="$(basename "$diskimg" .img).burn.img"
          ./AmlImg pack "$burn_name" burn/
          xz -9 -T0 "$burn_name"

      - name: Upload to Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.prepare.outputs.tag }} # 引用 prepare 阶段生成的唯一标签
          files: |
            output/images/*.xz
            *.burn.img.xz
