name: one

on:
  workflow_dispatch:
  push:
    branches:
      - readme
    paths:
      - .github/workflows/one.yml

env:
  SCRIPT_REPO: ${{ github.repository }}
  SCRIPT_REF: ${{ github.ref_name }}
  UBOOT_REPO: qxar86/onecloud-u-boot
  UBOOT_RELEASE: latest
  UBOOT_BURNIMG: eMMC.burn.img
  ARMBIAN_REPO: armbian/build
  ARMBIAN_REF: main
  PATCHES: 4077,5076
  PATCHES_DISABLED: 5082

permissions:
  contents: write

jobs:
  prepare:
    name: Prepare
    runs-on: ubuntu-22.04
    outputs:
      env: ${{ steps.get.outputs.env }}
    steps:
      - id: get
        name: Get repositories information
        run: |
          # 获取运行时间并生成 Tag
          TIME="$(curl -s https://api.github.com/repos/${SCRIPT_REPO}/actions/runs/${GITHUB_RUN_ID} | jq -r .created_at)"
          TAG="ci-$(date -d "${TIME}" -u +'%Y%m%d-%H%M%S-%Z')"

          # 获取各仓库 SHA
          SCRIPT_SHA=$(curl -s https://api.github.com/repos/${SCRIPT_REPO}/commits/${SCRIPT_REF} | jq -r .sha)
          UBOOT_TAG=$(curl -s https://api.github.com/repos/${UBOOT_REPO}/releases/${UBOOT_RELEASE} | jq -r .tag_name)
          ARMBIAN_SHA=$(curl -s https://api.github.com/repos/${ARMBIAN_REPO}/commits/${ARMBIAN_REF} | jq -r .sha)

          # 写入环境变量文件
          cat <<EOF >>$GITHUB_ENV
TIME=$TIME
TAG=$TAG
SCRIPT_SHA=$SCRIPT_SHA
UBOOT_TAG=$UBOOT_TAG
ARMBIAN_SHA=$ARMBIAN_SHA
EOF
          # Base64 编码后输出给后续 Job 使用
          echo "env=$(cat $GITHUB_ENV | base64 -w 0)" >>$GITHUB_OUTPUT

      - name: Generate release informations
        run: |
          cat <<EOF | tee Release.md
          CI $(date -d "$TIME" +'%Y-%m-%d %H:%M:%S %Z(%:z)')

          # Sources
          Script: [${SCRIPT_REPO}@${SCRIPT_REF}](https://github.com/${SCRIPT_REPO}/tree/${SCRIPT_REF}) ([\`${SCRIPT_SHA}\`](https://github.com/${SCRIPT_REPO}/tree/${SCRIPT_SHA}))
          U-Boot: [${UBOOT_REPO}@${UBOOT_RELEASE}](https://github.com/${UBOOT_REPO}/releases/tag/${UBOOT_RELEASE}) ([\`${UBOOT_TAG}\`](https://github.com/${UBOOT_REPO}/releases/tag/${UBOOT_TAG}))
          Armbian: [${ARMBIAN_REPO}@${ARMBIAN_REF}](https://github.com/${ARMBIAN_REPO}/tree/${ARMBIAN_REF}) ([\`${ARMBIAN_SHA}\`](https://github.com/${ARMBIAN_REPO}/tree/${ARMBIAN_SHA}))
          EOF

          echo "NAME=$(head -n 1 Release.md)" >>$GITHUB_ENV
          tail -n +2 Release.md > Body.md

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          target_commitish: ${{ github.sha }}
          name: ${{ env.NAME }}
          body_path: Body.md

  build-debs:
    name: Build Kernel
    needs: prepare
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        BRANCH: [current]
    steps:
      - name: Import env
        run: |
          echo "$(echo "${{ needs.prepare.outputs.env }}" | base64 -d)" >>$GITHUB_ENV

      - name: Checkout Armbian
        uses: actions/checkout@v4
        with:
          repository: ${{ env.ARMBIAN_REPO }}
          ref: ${{ env.ARMBIAN_SHA }}

      - name: Apply Patches
        if: env.PATCHES != ''
        run: |
          echo "::group::Download Patches"
          # 使用 IFS 拆分字符串，避免 YAML 语法解析冲突
          IFS=',' read -ra ADDR <<< "$PATCHES"
          for id in "${ADDR[@]}"; do
            echo "Downloading PR #$id patch..."
            curl -fsSL "https://github.com/armbian/build/pull/${id}.patch" -o "${id}.patch" || exit 1
          done
          echo "::endgroup::"

          for file in *.patch; do
            if [ -s "$file" ]; then
              echo "::group::Applying $file"
              patch --batch -p1 -N < "$file"
              echo "::endgroup::"
            fi
          done

      - name: Build Kernel
        run: |
          export GITHUB_ACTIONS=false
          sudo --preserve-env ./compile.sh kernel \
            ALLOW_ROOT=yes \
            BOARD=onecloud \
            BRANCH=${{ matrix.BRANCH }} \
            EXPERT=yes \
            USE_CCACHE=no
          sudo chown $(id -u):$(id -g) -R output/

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: debs-${{ matrix.BRANCH }}
          path: output/debs/*

      - name: Upload to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          files: output/debs/*

  build:
    name: Build Image (${{ matrix.RELEASE }}-${{ matrix.TYPE }})
    needs: [ prepare, build-debs ]
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        BRANCH: [current]
        RELEASE: [jammy, noble, bookworm, trixie]
        TYPE: [minimal, cli]
    steps:
      - name: Import env
        run: |
          echo "$(echo "${{ needs.prepare.outputs.env }}" | base64 -d)" >>$GITHUB_ENV

      - name: Checkout Armbian
        uses: actions/checkout@v4
        with:
          repository: ${{ env.ARMBIAN_REPO }}
          ref: ${{ env.ARMBIAN_SHA }}

      - name: Apply Patches
        if: env.PATCHES != ''
        run: |
          IFS=',' read -ra ADDR <<< "$PATCHES"
          for id in "${ADDR[@]}"; do
            curl -fsSL "https://github.com/armbian/build/pull/${id}.patch" -o "${id}.patch"
          done
          for file in *.patch; do
            [ -s "$file" ] && patch --batch -p1 -N < "$file"
          done

      - name: Download debs
        uses: actions/download-artifact@v4
        with:
          name: debs-${{ matrix.BRANCH }}
          path: output/debs/

      - name: Build OS Image
        run: |
          export GITHUB_ACTIONS=false
          sudo --preserve-env ./compile.sh build \
            ALLOW_ROOT=yes \
            BOARD=onecloud \
            BRANCH=${{ matrix.BRANCH }} \
            RELEASE=${{ matrix.RELEASE }} \
            KERNEL_CONFIGURE=no \
            BUILD_MINIMAL=${{ matrix.TYPE == 'minimal' && 'yes' || 'no' }} \
            BUILD_DESKTOP=no \
            EXPERT=yes \
            SKIP_EXTERNAL_TOOLCHAINS=yes \
            CLEAN_LEVEL= \
            USE_CCACHE=no \
            COMPRESS_OUTPUTIMAGE=img
          sudo chown $(id -u):$(id -g) -R output/

      - name: Generate Burn Image
        run: |
          sudo apt update && sudo apt install img2simg -y
          
          # 下载工具
          ver="v0.3.1"
          curl -fsSL -o ./AmlImg https://github.com/hzyitc/AmlImg/releases/download/$ver/AmlImg_${ver}_linux_amd64
          chmod +x ./AmlImg

          # 获取 U-Boot
          curl -fsSL -o ./uboot.img https://github.com/${UBOOT_REPO}/releases/download/${UBOOT_TAG}/${UBOOT_BURNIMG}
          ./AmlImg unpack ./uboot.img burn/

          # 提取分区并制作刷机包
          diskimg=$(ls output/images/*.img)
          loop=$(sudo losetup --find --show --partscan $diskimg)
          sudo img2simg ${loop}p1 burn/boot.simg
          sudo img2simg ${loop}p2 burn/rootfs.simg
          sudo losetup -d $loop
          sudo chown $(id -u):$(id -g) -R burn/

          echo -n "sha1sum $(sha1sum burn/boot.simg | awk '{print $1}')" >burn/boot.VERIFY
          echo -n "sha1sum $(sha1sum burn/rootfs.simg | awk '{print $1}')" >burn/rootfs.VERIFY

          cat <<EOF >>burn/commands.txt
          PARTITION:boot:sparse:boot.simg
          VERIFY:boot:normal:boot.VERIFY
          PARTITION:rootfs:sparse:rootfs.simg
          VERIFY:rootfs:normal:rootfs.VERIFY
          EOF

          prefix=$(ls output/images/*.img | sed 's/\.img$//')
          ./AmlImg pack ${prefix}.burn.img burn/

      - name: Hash and compress
        run: |
          cd output/images/
          for f in *.img; do
            sha256sum "$f" | tee -a ../../sha256sum
            xz -T0 "$f"
          done

      - name: Upload to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          append_body: true
          files: |
            output/images/*.burn.img
            output/images/*.xz
